name: PHP unit tests

on:
    push:
        paths:
            - '**workflows/php-unit-tests.yml'
            - '**.php'
            - '**phpunit.xml.dist'
            - '**composer.json'
    pull_request:
        paths:
            - '**workflows/php-unit-tests.yml'
            - '**.php'
            - '**phpunit.xml.dist'
            - '**composer.json'
    workflow_dispatch:

concurrency:
    group: "${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

jobs:
  execute-tests:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'skip tests') }}
    strategy:
      matrix:
        php-version: [ '8.2', '8.3', '8.4' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Adjust Composer Dependencies
        run: |
          composer remove syde/phpcs inpsyde/wp-stubs-versions --dev --no-update

      - name: Install Composer Dependencies
        uses: ramsey/composer-install@v3
        env:
          COMPOSER_AUTH: ${{ secrets.PACKAGIST_AUTH_JSON }}

      - name: Run unit tests
        run: ./vendor/bin/phpunit --testsuite=unit --no-coverage